<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050b12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Jarvis</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #050b12;
    --panel: #0b1620;
    --line: #17303f;
    --cyan: #46d3ea;
    --gold: #e5a92f;
    --text: #d7eaf0;
    --dim: #6f8f9c;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: radial-gradient(ellipse at 50% 28%, #0d2230 0%, var(--bg) 62%);
    color: var(--text);
    font-family: "Rajdhani", "Segoe UI", system-ui, sans-serif;
    font-size: 18px;
    display: flex; flex-direction: column; align-items: center;
    padding: max(20px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
    gap: 14px;
  }
  .hud { position: relative; width: min(46vh, 300px); aspect-ratio: 1; flex: none; cursor: pointer; border: 0; background: none; padding: 0; color: inherit; }
  .hud:focus-visible { outline: 2px solid var(--gold); outline-offset: 6px; border-radius: 50%; }
  .hud svg { width: 100%; height: 100%; overflow: visible; }
  .ring-a { transform-origin: 50% 50%; animation: spin 24s linear infinite; }
  .ring-b { transform-origin: 50% 50%; animation: spin 16s linear infinite reverse; }
  .core { transform-origin: 50% 50%; transition: fill .3s; fill: var(--cyan); opacity: .9; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.35); } }
  @keyframes breathe { 0%,100% { transform: scale(1); } 50% { transform: scale(1.15); } }
  body[data-mode="listening"] .core { animation: pulse 1s ease-in-out infinite; fill: var(--gold); }
  body[data-mode="thinking"] .ring-a { animation-duration: 2.5s; }
  body[data-mode="thinking"] .ring-b { animation-duration: 1.8s; }
  body[data-mode="speaking"] .core { animation: breathe 0.6s ease-in-out infinite; }
  @media (prefers-reduced-motion: reduce) {
    .ring-a, .ring-b, .core { animation: none !important; }
  }
  #status { font-size: 22px; font-weight: 600; letter-spacing: .02em; min-height: 1.3em; text-align: center; }
  #live { color: var(--dim); min-height: 1.3em; text-align: center; font-size: 17px; }
  #log {
    flex: 1; width: min(640px, 100%); overflow-y: auto;
    display: flex; flex-direction: column; gap: 8px;
    padding: 4px 2px; min-height: 0;
  }
  .msg { padding: 8px 12px; border-left: 2px solid var(--line); background: var(--panel); max-width: 92%; line-height: 1.35; }
  .msg.me { align-self: flex-end; border-left: 0; border-right: 2px solid var(--gold); }
  .msg.bot { border-left-color: var(--cyan); }
  .msg a { color: var(--gold); }
  .bar { width: min(640px, 100%); display: flex; flex-wrap: wrap; gap: 8px; flex: none; }
  .bar input[type="text"] {
    flex: 1; background: var(--panel); border: 1px solid var(--line); color: var(--text);
    padding: 10px 12px; font: inherit; border-radius: 4px;
  }
  button.btn {
    background: var(--panel); color: var(--text); border: 1px solid var(--line);
    padding: 10px 14px; font: inherit; border-radius: 4px; cursor: pointer;
  }
  button.btn:hover { border-color: var(--cyan); }
  button.btn[aria-pressed="true"] { border-color: var(--gold); color: var(--gold); }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  details { width: min(640px, 100%); flex: none; color: var(--dim); font-size: 16px; }
  details summary { cursor: pointer; }
  details label { display: block; margin-top: 8px; }
  details input { width: 100%; margin-top: 4px; background: var(--panel); border: 1px solid var(--line); color: var(--text); padding: 8px 10px; font: inherit; border-radius: 4px; }
  details a { color: var(--gold); }
  .top { width: min(640px, 100%); display: flex; justify-content: space-between; align-items: baseline; padding-bottom: 8px; border-bottom: 1px solid var(--line); flex: none; }
  .brand { font-size: 24px; font-weight: 600; color: var(--cyan); }
  #clock { color: var(--dim); font-variant-numeric: tabular-nums; font-size: 17px; }
  .hud svg { filter: drop-shadow(0 0 14px rgba(70,211,234,.25)); transition: filter .4s; }
  body[data-mode="listening"] .hud svg { filter: drop-shadow(0 0 26px rgba(229,169,47,.5)); }
  body[data-mode="speaking"] .hud svg { filter: drop-shadow(0 0 26px rgba(70,211,234,.55)); }
  .msg { animation: in .25s ease-out; }
  @keyframes in { from { opacity: 0; transform: translateY(5px); } }
  .chips { width: min(640px, 100%); display: flex; flex-wrap: wrap; gap: 6px; flex: none; }
  .chip { background: transparent; color: var(--dim); border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; font: inherit; font-size: 16px; cursor: pointer; }
  .chip:hover { color: var(--cyan); border-color: var(--cyan); }
  .chip:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { .msg { animation: none; } }
  .stage { display: flex; align-items: center; justify-content: center; gap: 28px; flex: none; }
  .radar { --sweep: rgba(70,211,234,.5); position: relative; width: min(15vh, 124px); aspect-ratio: 1; border-radius: 50%; overflow: hidden;
    border: 1px solid var(--line);
    background:
      linear-gradient(var(--line), var(--line)) center / 1px 100% no-repeat,
      linear-gradient(var(--line), var(--line)) center / 100% 1px no-repeat,
      repeating-radial-gradient(circle, transparent 0 14%, var(--line) 14% calc(14% + 1px)),
      #07121b; }
  .radar::after { content: ""; position: absolute; inset: 0; border-radius: 50%;
    background: conic-gradient(from 0deg, transparent 0 295deg, var(--sweep) 360deg);
    animation: spin 4s linear infinite; }
  .blip { position: absolute; left: var(--x); top: var(--y); width: 6px; height: 6px; margin: -3px 0 0 -3px; border-radius: 50%;
    background: var(--gold); box-shadow: 0 0 6px var(--gold); opacity: 0; animation: blip 4s linear infinite; animation-delay: var(--d); }
  @keyframes blip { 0% { opacity: 1; } 65% { opacity: 0; } 100% { opacity: 0; } }
  body[data-mode="listening"] .radar { --sweep: rgba(229,169,47,.55); }
  body[data-mode="thinking"] .radar::after { animation-duration: 1.4s; }
  @media (max-width: 560px) { .stage { flex-direction: column; gap: 12px; } }
  @media (prefers-reduced-motion: reduce) { .radar::after { animation: none; } .blip { animation: none; opacity: .8; } }
  .code { display: none; position: fixed; top: 0; bottom: 0; width: 150px; overflow: hidden; pointer-events: none; z-index: 0;
    -webkit-mask-image: linear-gradient(transparent, #000 15%, #000 85%, transparent); mask-image: linear-gradient(transparent, #000 15%, #000 85%, transparent); }
  .code.l { left: 14px; }
  .code.r { right: 14px; text-align: right; }
  .code pre { margin: 0; font: 10.5px/1.55 ui-monospace, "Cascadia Code", Consolas, monospace; color: var(--cyan); opacity: .34; white-space: pre; animation: scrollup 70s linear infinite; }
  .code.r pre { color: var(--gold); opacity: .28; animation-duration: 90s; }
  @keyframes scrollup { to { transform: translateY(-50%); } }
  body[data-mode="thinking"] .code pre { animation-duration: 9s; }
  @media (min-width: 1000px) { .code { display: block; } }
  @media (prefers-reduced-motion: reduce) { .code pre { animation: none; } }
  .hud .ring-a circle { stroke: var(--cyan); }
  .hud .ring-b circle { stroke: var(--gold); }
  body.red { --cyan: #ff5a4a; --gold: #f5b942; --bg: #0c0605; --panel: #160c0a; --line: #3a1a14; --text: #f3dcd6; --dim: #a8847a;
    background: radial-gradient(ellipse at 50% 28%, #2a100c 0%, var(--bg) 62%); }
  #sys { color: var(--dim); font-size: 15px; }
  @media (max-width: 700px) { #sys { display: none; } }
  #boot { position: fixed; inset: 0; z-index: 50; background: var(--bg); display: flex; align-items: center; justify-content: center; transition: opacity .6s; cursor: pointer; }
  #boot.off { opacity: 0; pointer-events: none; }
  #boot pre { margin: 0; color: var(--cyan); font: 15px/1.7 ui-monospace, "Cascadia Code", Consolas, monospace; min-width: min(420px, 88vw); }
  .hud svg circle[r="134"] { stroke: var(--tick, #2a5668); }
  .hud svg circle[r="82"] { stroke: var(--cyan); }
  .hud svg circle[r="140"] { stroke: var(--line); }
  .hud svg circle[r="70"] { fill: var(--panel); }
  #memoBody .row { display: flex; justify-content: space-between; gap: 8px; padding: 4px 0; border-bottom: 1px solid var(--line); color: var(--text); }
  #memoBody button { background: none; border: 0; color: var(--dim); cursor: pointer; font: inherit; }
  #memoBody button:hover { color: var(--gold); }
  #memoBody p { margin: 8px 0 2px; color: var(--cyan); }

  /* ---- Mode tactique ---- */
  body.tac { --cyan: #5dff8a; --gold: #ffb000; --bg: #060905; --panel: #0b110b; --line: #243a26; --text: #d6ecd9; --dim: #78967d; --tick: #2f5a36;
    font-family: "Share Tech Mono", ui-monospace, "Cascadia Code", Consolas, monospace; font-size: 16px;
    background:
      linear-gradient(rgba(93,255,138,.055) 1px, transparent 1px) 0 0 / 36px 36px,
      linear-gradient(90deg, rgba(93,255,138,.055) 1px, transparent 1px) 0 0 / 36px 36px,
      radial-gradient(ellipse at 50% 30%, #0f1d10 0%, var(--bg) 65%); }
  body.tac .brand { letter-spacing: .12em; }
  body.tac .brand::before { content: "[ "; }
  body.tac .brand::after { content: " ]"; }
  body.tac #status { letter-spacing: .14em; text-transform: uppercase; font-size: 19px; }
  body.tac .msg { border-radius: 0; }
  body.tac .msg.bot::before { content: "JARVIS ▸ "; color: var(--gold); }
  body.tac .msg.me::before { content: "CMD ▸ "; color: var(--dim); }
  body.tac .btn, body.tac .chip, body.tac .bar input[type="text"], body.tac details input { border-radius: 0; }
  body.tac .chip { text-transform: uppercase; font-size: 14px; letter-spacing: .06em; }
  body.tac .hud::before, body.tac .hud::after { content: ""; position: absolute; background: var(--cyan); opacity: .35; pointer-events: none; }
  body.tac .hud::before { left: -14%; right: -14%; top: 50%; height: 1px; }
  body.tac .hud::after { top: -14%; bottom: -14%; left: 50%; width: 1px; }
  body.tac .stage { padding: 20px 28px;
    background:
      linear-gradient(var(--gold), var(--gold)) top left / 18px 2px no-repeat, linear-gradient(var(--gold), var(--gold)) top left / 2px 18px no-repeat,
      linear-gradient(var(--gold), var(--gold)) top right / 18px 2px no-repeat, linear-gradient(var(--gold), var(--gold)) top right / 2px 18px no-repeat,
      linear-gradient(var(--gold), var(--gold)) bottom left / 18px 2px no-repeat, linear-gradient(var(--gold), var(--gold)) bottom left / 2px 18px no-repeat,
      linear-gradient(var(--gold), var(--gold)) bottom right / 18px 2px no-repeat, linear-gradient(var(--gold), var(--gold)) bottom right / 2px 18px no-repeat; }
</style>
</head>
<body data-mode="idle">

<div id="boot"><pre id="bootText"></pre></div>

<div class="code l" aria-hidden="true"><pre id="codeL"></pre></div>
<div class="code r" aria-hidden="true"><pre id="codeR"></pre></div>

<header class="top"><span class="brand">Jarvis</span><span id="sys"></span><span id="clock"></span></header>

<div class="stage">
<button class="hud" id="hud" aria-label="Parler à Jarvis">
  <svg viewBox="0 0 300 300" aria-hidden="true">
    <circle cx="150" cy="150" r="140" fill="none" stroke="#17303f" stroke-width="1"/>
    <circle cx="150" cy="150" r="134" fill="none" stroke="#2a5668" stroke-width="6" stroke-dasharray="1 6.99"/>
    <circle cx="150" cy="150" r="82" fill="none" stroke="#46d3ea" stroke-width="1" opacity=".5"/>
    <g class="ring-a">
      <circle cx="150" cy="150" r="124" fill="none" stroke="#46d3ea" stroke-width="2" stroke-dasharray="60 20 8 20"/>
    </g>
    <g class="ring-b">
      <circle cx="150" cy="150" r="98" fill="none" stroke="#e5a92f" stroke-width="3" stroke-dasharray="4 10"/>
    </g>
    <circle cx="150" cy="150" r="70" fill="#0b1620" stroke="#17303f" stroke-width="1"/>
    <circle class="core" cx="150" cy="150" r="34"/>
  </svg>
</button>
<div class="radar" aria-hidden="true">
  <i class="blip" style="--x:69%;--y:27%;--d:.44s"></i>
  <i class="blip" style="--x:74%;--y:79%;--d:1.56s"></i>
  <i class="blip" style="--x:33%;--y:64%;--d:2.56s"></i>
  <i class="blip" style="--x:24%;--y:28%;--d:3.44s"></i>
</div>
</div>

<div id="status">Prêt</div>
<div id="live"></div>

<div id="log" aria-live="polite"></div>

<div class="chips">
  <button class="chip" data-cmd="quelle heure est-il">Heure</button>
  <button class="chip" data-cmd="minuterie 5 minutes">Minuterie 5 min</button>
  <button class="chip" data-cmd="ouvre youtube">YouTube</button>
  <button class="chip" data-cmd="ouvre spotify">Spotify</button>
  <button class="chip" data-cmd="mets de la musique">Musique</button>
  <button class="chip" data-cmd="quelle est la météo">Météo</button>
  <button class="chip" data-cmd="infos du matin">Infos du matin</button>
</div>

<div class="bar">
  <input type="text" id="typed" placeholder="Ou écris ta commande…" autocomplete="off">
  <button class="btn" id="send">Envoyer</button>
  <button class="btn" id="cont" aria-pressed="false" title="Jarvis écoute en boucle">Écoute continue</button>
  <button class="btn" id="theme" title="Changer de couleurs">Thème</button>
  <button class="btn" id="wake" aria-pressed="false" title="En écoute continue, ne réagit que si tu dis Jarvis">Dire « Jarvis »</button>
</div>

<details id="memo">
  <summary>Dossier : mémoire et notes</summary>
  <div id="memoBody"></div>
</details>

<details id="settings">
  <summary>Réglages</summary>
  <label>Clé API Groq ou OpenRouter (facultatif)
    <input type="password" id="key" placeholder="gsk_… (Groq) ou sk-or-v1-… (OpenRouter)" autocomplete="off">
  </label>
  <label>Ville pour la météo
    <input type="text" id="city" placeholder="La Jaudonnière">
  </label>
  <label>Surnom (vide = « patron » et « boss » en alternance)
    <input type="text" id="nick" placeholder="patron / boss">
  </label>
  <label>Modèle
    <input type="text" id="model" placeholder="laisser vide = modèle par défaut">
  </label>
  <p>Clé Groq : <a href="https://console.groq.com/keys" target="_blank" rel="noopener">console.groq.com/keys</a>. Clé OpenRouter : <a href="https://openrouter.ai/keys" target="_blank" rel="noopener">openrouter.ai/keys</a>. Jarvis reconnaît le service à la clé. Elle reste dans ce navigateur.</p>
</details>

<script>
const $ = s => document.querySelector(s);
const store = {
  get(k, d = "") { try { return localStorage.getItem(k) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} }
};

const SYSTEM = "Tu es J.A.R.V.I.S., l'assistant d'Iron Man : élégant, discret, d'un humour pince-sans-rire. Réponds en français, en une à trois phrases courtes, sans markdown ni liste. Tutoie l'utilisateur et appelle-le de temps en temps « patron » ou « boss ». Sois précis et efficace, et propose parfois la suite utile en une demi-phrase.";
const SITES = {
  youtube: "https://www.youtube.com", google: "https://www.google.com", gmail: "https://mail.google.com",
  maps: "https://maps.google.com", netflix: "https://www.netflix.com", twitch: "https://www.twitch.tv",
  spotify: "https://open.spotify.com", twitter: "https://x.com", reddit: "https://www.reddit.com", wikipedia: "https://fr.wikipedia.org", instagram: "https://www.instagram.com", tiktok: "https://www.tiktok.com",
  discord: "https://discord.com/app", github: "https://github.com", amazon: "https://www.amazon.fr", deezer: "https://www.deezer.com",
  soundcloud: "https://soundcloud.com", chatgpt: "https://chatgpt.com", claude: "https://claude.ai", actualites: "https://news.google.com/?hl=fr"
};

const ALIAS = { musique: "spotify", actus: "actualites", actualités: "actualites", news: "actualites", infos: "actualites", mail: "gmail", insta: "instagram" };
const SEARCH = {
  youtube: "https://www.youtube.com/results?search_query=", spotify: "https://open.spotify.com/search/",
  google: "https://www.google.com/search?q=", wikipedia: "https://fr.wikipedia.org/w/index.php?search=",
  amazon: "https://www.amazon.fr/s?k=", maps: "https://www.google.com/maps/search/"
};
let history = [];
const mem = {
  get() { try { return JSON.parse(store.get("jarvis_mem", "[]")); } catch { return []; } },
  set(a) { store.set("jarvis_mem", JSON.stringify(a)); }
};
const notes = {
  get() { try { return JSON.parse(store.get("jarvis_notes", "[]")); } catch { return []; } },
  set(a) { store.set("jarvis_notes", JSON.stringify(a)); }
};
function sysPrompt() {
  const m = mem.get();
  return SYSTEM + (store.get("jarvis_nick") ? " L'utilisateur veut qu'on l'appelle « " + store.get("jarvis_nick") + " »." : "") + " Date et heure : " + new Date().toLocaleString("fr-FR", { dateStyle: "full", timeStyle: "short" }) + "." +
    (m.length ? " Informations retenues sur l'utilisateur : " + m.join(" ; ") + "." : "");
}
function nick() { return store.get("jarvis_nick") || (Math.random() < 0.5 ? "patron" : "boss"); }
const THEMES = ["tac", "blue", "red"];
function themeName() { return store.get("jarvis_theme2") || "tac"; }
function setTheme(name) {
  if (!THEMES.includes(name)) name = "tac";
  document.body.classList.remove("tac", "red");
  if (name !== "blue") document.body.classList.add(name);
  store.set("jarvis_theme2", name);
}
function renderMemo() {
  const body = $("#memoBody"); body.innerHTML = "";
  const sect = (title, arr, st) => {
    const h = document.createElement("p"); h.textContent = title + " (" + arr.length + ")"; body.append(h);
    if (!arr.length) { const e = document.createElement("div"); e.textContent = "Vide"; body.append(e); return; }
    arr.forEach((txt, i) => {
      const r = document.createElement("div"); r.className = "row";
      const sp = document.createElement("span"); sp.textContent = txt;
      const b = document.createElement("button"); b.textContent = "✕"; b.setAttribute("aria-label", "Supprimer");
      b.onclick = () => { const a = st.get(); a.splice(i, 1); st.set(a); renderMemo(); };
      r.append(sp, b); body.append(r);
    });
  };
  sect("Mémoire", mem.get(), mem);
  sect("Notes", notes.get(), notes);
}
function chime(f = 660, d = 0.12) {
  try {
    const c = new (window.AudioContext || window.webkitAudioContext)(), o = c.createOscillator(), g = c.createGain();
    o.type = "sine"; o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, c.currentTime);
    g.gain.exponentialRampToValueAtTime(0.08, c.currentTime + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + d);
    o.connect(g); g.connect(c.destination); o.start(); o.stop(c.currentTime + d + 0.02);
  } catch {}
}
async function diagnostic() {
  const parts = [navigator.onLine ? "réseau opérationnel" : "réseau hors ligne"];
  try { const b = await navigator.getBattery(); parts.push("batterie à " + Math.round(b.level * 100) + " pour cent" + (b.charging ? ", en charge" : "")); } catch {}
  parts.push(SR ? "micro disponible" : "micro indisponible");
  const n = mem.get().length;
  parts.push(n + " information" + (n > 1 ? "s" : "") + " en mémoire");
  return "Diagnostic terminé : " + parts.join(", ") + ".";
}
let busy = false;
let continuous = false;
let wake = false;          // exiger le mot « Jarvis » en écoute continue
let lastStart = 0;         // pour éviter les redémarrages en boucle
let ignoreUntil = 0;       // ignorer le micro juste après que Jarvis a parlé
let convoUntil = 0;        // fenêtre de conversation après une réponse

/* ---------- Interface ---------- */
function setMode(m, text) {
  document.body.dataset.mode = m;
  $("#status").textContent = text || ({ idle: "Prêt", listening: "Je t'écoute…", thinking: "Je réfléchis…", speaking: "Jarvis" }[m]);
}
function addMsg(who, text, link) {
  const d = document.createElement("div");
  d.className = "msg " + who;
  d.textContent = text;
  if (link) {
    d.append(" ");
    const a = document.createElement("a");
    a.href = link; a.target = "_blank"; a.rel = "noopener"; a.textContent = "Ouvrir";
    d.append(a);
  }
  $("#log").append(d);
  $("#log").scrollTop = $("#log").scrollHeight;
}

/* ---------- Voix : sortie ---------- */
function speak(text) {
  return new Promise(resolve => {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text.replace(/[*_#`]/g, ""));
    u.lang = "fr-FR";
    const fr = speechSynthesis.getVoices().filter(v => v.lang.toLowerCase().startsWith("fr"));
    const v = fr.find(v => /thomas|paul|henri|antoine|nicolas|male|homme/i.test(v.name)) || fr[0];
    if (v) u.voice = v;
    u.pitch = 0.4;   // grave (0 à 2, 1 = normal)
    u.rate = 1.12;   // vitesse (1 = normal)
    u.onstart = () => setMode("speaking");
    u.onend = u.onerror = () => resolve();
    speechSynthesis.speak(u);
  });
}

/* ---------- Voix : entrée ---------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, recActive = false;
if (!SR) {
  setMode("idle", "Reconnaissance vocale indisponible : utilise Chrome");
} else {
  rec = new SR();
  rec.lang = "fr-FR";
  rec.interimResults = true;
  rec.continuous = false;
  rec.onstart = () => { recActive = true; lastStart = Date.now(); setMode("listening"); };
  rec.onresult = async e => {
    if (busy || Date.now() < ignoreUntil) return;   // ne pas s'entendre soi-même
    let interim = "", final = "";
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const t = e.results[i][0].transcript;
      if (e.results[i].isFinal) final += t; else interim += t;
    }
    $("#live").textContent = interim || final;
    let txt = final.trim();
    if (!txt) return;
    if (continuous && wake) {
      const heard = /\bjarvis\b/i.test(txt);
      if (!heard && Date.now() > convoUntil) { $("#live").textContent = ""; return; }
      txt = txt.replace(/^.*?\bjarvis\b[,\s]*/i, "").trim();
      if (!txt) {                                    // juste « Jarvis »
        busy = true;
        await speak("Oui, " + nick() + " ?");
        convoUntil = Date.now() + 12000; ignoreUntil = Date.now() + 700;
        busy = false; setMode(recActive ? "listening" : "idle");
        return;
      }
    }
    busy = true;
    chime(740, 0.1);
    handle(txt);
  };
  rec.onerror = e => {
    if (e.error === "not-allowed" || e.error === "service-not-allowed") {
      continuous = false; syncCont();
      setMode("idle", "Micro refusé : autorise-le dans la barre d'adresse");
    } else if (e.error === "network") {
      continuous = false; syncCont();
      setMode("idle", "Reconnaissance vocale injoignable (réseau)");
    }
    // « no-speech » et « aborted » sont normaux : on redémarre sans bruit
  };
  rec.onend = () => {
    recActive = false;
    if (busy) return;                       // handle() relancera l'écoute à la fin
    if (continuous) {
      // redémarrage discret : on garde « Je t'écoute » à l'écran, avec une pause si ça coupe trop vite
      const delay = Date.now() - lastStart < 1500 ? 1500 : 200;
      setTimeout(listen, delay);
    } else {
      setMode("idle");
    }
  };
}
function listen() {
  if (!rec || recActive || busy) return;
  rec.continuous = continuous;   // écoute continue : une seule session micro, sans réautorisation
  try { rec.start(); } catch {}
}

/* ---------- Commandes locales ---------- */
function openSite(url) {
  const w = window.open(url, "_blank");
  if (!w) return url;          // bloqué par Chrome : on renvoie le lien à cliquer
  try { w.opener = null; } catch {}
  return null;
}
function startTimer(ms, label, msg) {
  setTimeout(async () => {
    beep();
    const t = msg ? nick() + ", rappel : " + msg + "." : nick() + ", ta minuterie de " + label + " est terminée.";
    addMsg("bot", t);
    await speak(t);
  }, ms);
}
function beep() {
  try {
    const c = new AudioContext(), o = c.createOscillator(), g = c.createGain();
    o.connect(g); g.connect(c.destination);
    o.frequency.value = 880; g.gain.value = 0.15;
    o.start(); o.stop(c.currentTime + 0.5);
  } catch {}
}
function wxText(c) {
  if (c === 0) return "ciel dégagé";
  if (c <= 2) return "ciel plutôt dégagé";
  if (c === 3) return "ciel couvert";
  if (c <= 48) return "brouillard";
  if (c <= 57) return "bruine";
  if (c <= 67) return "pluie";
  if (c <= 77) return "neige";
  if (c <= 82) return "averses";
  if (c <= 86) return "averses de neige";
  return "orage";
}
async function getWeather(cityArg) {
  const city = cityArg || store.get("jarvis_city") || "La Jaudonnière";
  try {
    const g = await (await fetch("https://geocoding-api.open-meteo.com/v1/search?count=1&language=fr&name=" + encodeURIComponent(city))).json();
    const p = g.results && g.results[0];
    if (!p) return "Je ne trouve pas la ville " + city + ". Tu peux la changer dans les réglages.";
    const w = await (await fetch("https://api.open-meteo.com/v1/forecast?latitude=" + p.latitude + "&longitude=" + p.longitude +
      "&current=temperature_2m,weather_code&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=auto&forecast_days=1")).json();
    const c = w.current, d = w.daily;
    return "À " + p.name + ", il fait " + Math.round(c.temperature_2m) + " degrés, " + wxText(c.weather_code) +
      ". Aujourd'hui, entre " + Math.round(d.temperature_2m_min[0]) + " et " + Math.round(d.temperature_2m_max[0]) +
      " degrés, avec " + d.precipitation_probability_max[0] + " pour cent de risque de pluie.";
  } catch { return "Je n'arrive pas à joindre le service météo."; }
}
async function briefing() {
  const d = new Date(), h = d.getHours();
  const hello = h < 6 ? "Bonne nuit" : h < 18 ? "Bonjour" : "Bonsoir";
  const date = d.toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long" });
  const heure = d.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });
  return hello + " " + nick() + ". Nous sommes le " + date + ", il est " + heure + ". " + await getWeather() +
    " Pour les actualités, dis : ouvre les actus.";
}

async function localCommand(raw) {
  const t = raw.toLowerCase();

  if (/\b(tais-toi|silence|stop|arrête)\b/.test(t)) { speechSynthesis.cancel(); return { reply: "D'accord." }; }
  if (/\befface (la )?(conversation|historique)\b/.test(t)) { history = []; $("#log").innerHTML = ""; return { reply: "Mémoire effacée." }; }

  const rem = raw.match(/rappelle[- ]moi\s+(?:dans\s+)?(\d+)\s*(secondes?|sec|minutes?|min|heures?)\s*(?:de |d'|que |pour )?(.*)/i);
  if (rem) {
    const n = parseInt(rem[1], 10), u = rem[2];
    const ms = u.startsWith("h") ? n * 3600000 : u.startsWith("m") ? n * 60000 : n * 1000;
    startTimer(ms, rem[1] + " " + u, rem[3].trim());
    return { reply: "Je te le rappellerai dans " + rem[1] + " " + u + "." };
  }

  const nn = raw.match(/\bappelle[- ]moi\s+(.+)/i);
  if (nn) {
    const v = nn[1].trim().replace(/[.!?]+$/, "");
    if (/patron ou boss|comme avant|par défaut/i.test(v)) { store.set("jarvis_nick", ""); $("#nick").value = ""; return { reply: "Entendu, ce sera patron ou boss.", raw: true }; }
    store.set("jarvis_nick", v); $("#nick").value = v;
    return { reply: "Entendu, je t'appellerai " + v + ".", raw: true };
  }

  const keep = raw.match(/\b(?:retiens|mémorise|souviens-toi)\s+(?:que\s+|qu')?(.+)/i);
  if (keep) { const m = mem.get(); m.push(keep[1].trim()); mem.set(m.slice(-40)); return { reply: "C'est noté." }; }
  if (/\b(?:oublie tout|efface (?:ta|la) mémoire|réinitialise ta mémoire)/.test(t)) { mem.set([]); return { reply: "Mémoire effacée." }; }
  if (/que sais[- ]tu (?:de|sur) moi|(?:qu'est-ce que|ce que) tu sais (?:de|sur) moi|ce dont tu te souviens|que retiens[- ]tu/.test(t)) {
    const m = mem.get();
    return { reply: m.length ? "Voici ce que je sais : " + m.join(". ") + "." : "Je ne sais encore rien sur toi." };
  }

  const nt = raw.match(/^(?:prends? note|note)\b\s*(?:que |de |:)?\s*(.+)/i);
  if (nt) { const n = notes.get(); n.push(nt[1].trim()); notes.set(n.slice(-60)); return { reply: "Note enregistrée." }; }
  if (/efface (?:mes|les) notes/.test(t)) { notes.set([]); return { reply: "Tes notes sont effacées." }; }
  if (/\b(?:lis|relis|montre)[- ]?(?:moi )?(?:mes|les) notes|mes notes/.test(t)) {
    const n = notes.get();
    return { reply: n.length ? "Tu as " + n.length + " note" + (n.length > 1 ? "s" : "") + " : " + n.join(". ") + "." : "Tu n'as aucune note." };
  }

  if (/diagnostic|état du système|statut système/.test(t)) return { reply: await diagnostic() };
  const th = t.match(/th[èe]me\s+(rouge|bleu|tactique|vert|iron man|classique)|mode (tactique|classique)/);
  if (th) {
    const w = th[1] || th[2];
    setTheme(w === "rouge" || w === "iron man" ? "red" : w === "bleu" || w === "classique" ? "blue" : "tac");
    return { reply: "Thème modifié." };
  }

  if (/info.{0,12}matin|briefing|résumé de (la|ma) journée|ma journée/.test(t)) return { reply: await briefing(), raw: true };
  if (/m[ée]t[ée]o|quel temps|il (va )?pleu|fait[- ]il (froid|chaud|beau)/.test(t)) {
    const c = t.match(/(?:à|a|de|pour|sur|en)\s+([a-zéèêàçîô' -]{2,})$/);
    const city = c && !/aujourd|demain|matin|soir|maintenant|moment/.test(c[1]) ? c[1].trim() : "";
    return { reply: await getWeather(city) };
  }

  if (/\bquelle heure\b|\bl'heure\b/.test(t)) {
    return { reply: "Il est " + new Date().toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" }) + "." };
  }
  if (/\bquel jour\b|\bla date\b|\bon est le combien\b/.test(t)) {
    return { reply: "Nous sommes le " + new Date().toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long", year: "numeric" }) + "." };
  }

  const tm = t.match(/(\d+)\s*(secondes?|sec|minutes?|min|heures?)/);
  if (tm && /minuteu?r|minuterie|chrono|timer|rappelle/.test(t)) {
    const n = parseInt(tm[1], 10), u = tm[2];
    const ms = u.startsWith("h") ? n * 3600000 : u.startsWith("m") ? n * 60000 : n * 1000;
    startTimer(ms, tm[0]);
    return { reply: "Minuterie lancée pour " + tm[0] + "." };
  }

  const site = t.match(/\b(ouvre|ouvrir|lance|va sur)\s+(?:le site\s+|l'application\s+|l'appli\s+|les\s+|la\s+|le\s+|l')?([\wéèêàç-]+)/);
  if (site) {
    const k = ALIAS[site[2]] || site[2];
    if (SITES[k]) return { reply: "J'ouvre " + site[2] + ".", link: openSite(SITES[k]) };
    if (site[1] !== "lance") return { reply: "Je cherche " + site[2] + ".", link: openSite(SEARCH.google + encodeURIComponent(site[2])) };
  }

  const sr = t.match(/\b(?:cherche|recherche|trouve(?:-moi)?)\s+(.+?)\s+sur\s+(youtube|spotify|google|wikip[ée]dia|amazon|maps)\s*$/);
  if (sr) {
    const where = sr[2].replace("é", "e");
    return { reply: "Je cherche " + sr[1] + " sur " + where + ".", link: openSite(SEARCH[where] + encodeURIComponent(sr[1])) };
  }

  const sp = t.match(/\b(?:mets|joue|passe)\s+(?:moi\s+)?(?:du |de la |des |le titre |la chanson |l'album |le son )?(.+?)(?:\s+sur spotify)?\s*$/);
  if (sp && !/sur youtube/.test(t)) {
    const q = sp[1].trim();
    if (/^(la |de la |)musique$/.test(q)) return { reply: "J'ouvre Spotify.", link: openSite(SITES.spotify) };
    return { reply: "Je cherche " + q + " sur Spotify.", link: openSite(SEARCH.spotify + encodeURIComponent(q)) };
  }

  const yt = t.match(/\b(?:mets|joue|lance)\s+(.+?)\s+sur youtube/);
  if (yt) return { reply: "Je cherche " + yt[1] + " sur YouTube.", link: openSite(SEARCH.youtube + encodeURIComponent(yt[1])) };

  const s2 = t.match(/\b(?:cherche|recherche|google)\s+(.+)/);
  if (s2) return { reply: "Je cherche " + s2[1] + ".", link: openSite(SEARCH.google + encodeURIComponent(s2[1])) };

  return null;
}

/* ---------- Réponses libres : sans clé (Wikipédia / Google) ---------- */
async function fallback(q) {
  const m = q.toLowerCase().match(/^(?:c'est quoi|qu'est-ce que|qu'est ce que|qui est|qui était|définition de|parle-moi de|explique-moi)\s+(?:un |une |le |la |les |l'|des |du |de la )?(.+?)\s*\??$/);
  if (m) {
    try {
      const sr = await fetch("https://fr.wikipedia.org/w/api.php?action=query&list=search&srsearch=" + encodeURIComponent(m[1]) + "&format=json&origin=*&srlimit=1");
      const title = (await sr.json()).query.search[0]?.title;
      if (title) {
        const r = await fetch("https://fr.wikipedia.org/api/rest_v1/page/summary/" + encodeURIComponent(title));
        const d = await r.json();
        if (d.extract) {
          const short = d.extract.split(/(?<=\.)\s/).slice(0, 2).join(" ");
          return { reply: short, link: d.content_urls?.desktop?.page };
        }
      }
    } catch {}
  }
  const url = "https://www.google.com/search?q=" + encodeURIComponent(q);
  const l = openSite(url);
  return { reply: l ? "Je n'ai pas d'IA connectée. Chrome a bloqué la recherche : clique sur Ouvrir." : "Je n'ai pas d'IA connectée. J'ouvre une recherche Google.", link: l };
}

/* ---------- OpenRouter (facultatif) ---------- */
async function askLLM(q) {
  const key = store.get("jarvis_or_key");
  if (!key) return fallback(q);
  const groq = key.startsWith("gsk_");
  const url = groq ? "https://api.groq.com/openai/v1/chat/completions" : "https://openrouter.ai/api/v1/chat/completions";
  const model = store.get("jarvis_or_model") || (groq ? "openai/gpt-oss-20b" : "openrouter/free");
  history.push({ role: "user", content: q });
  try {
    const r = await fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + key },
      body: JSON.stringify({
        model,
        messages: [{ role: "system", content: sysPrompt() }, ...history.slice(-10)]
      })
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error?.message || r.status);
    const a = data.choices?.[0]?.message?.content?.trim() || "Je n'ai pas de réponse.";
    history.push({ role: "assistant", content: a });
    return { reply: a };
  } catch (err) {
    history.pop();
    const f = await fallback(q);
    f.reply = "Erreur IA : " + err.message + ". " + f.reply;
    return f;
  }
}

/* ---------- Boucle principale ---------- */
async function handle(text) {
  busy = true;
  $("#live").textContent = "";
  addMsg("me", text);
  setMode("thinking");
  let reply, link;
  const cmd = await localCommand(text);
  renderMemo();
  if (cmd) {
    reply = cmd.raw ? cmd.reply : cmd.reply.replace(/\.$/, ", " + nick() + ".");
    link = cmd.link;
    if (link) reply = "Chrome a bloqué l'ouverture, " + nick() + ". Clique sur Ouvrir, ou autorise les pop-ups pour cette page via l'icône dans la barre d'adresse.";
  }
  else { const r = await askLLM(text); reply = r.reply; link = r.link; }
  addMsg("bot", reply, link);
  await speak(reply);
  ignoreUntil = Date.now() + 700;
  convoUntil = Date.now() + 12000;
  busy = false;
  setMode(recActive ? "listening" : "idle");
  if (continuous) listen();
}

/* ---------- Événements ---------- */
$("#hud").onclick = () => {
  if (busy) { speechSynthesis.cancel(); return; }
  if (recActive) rec.stop(); else listen();
};
function sendTyped() {
  const v = $("#typed").value.trim();
  if (v && !busy) { $("#typed").value = ""; handle(v); }
}
$("#send").onclick = sendTyped;
$("#typed").addEventListener("keydown", e => { if (e.key === "Enter") sendTyped(); });

function syncCont() {
  $("#cont").setAttribute("aria-pressed", String(continuous));
}
$("#wake").onclick = () => {
  wake = !wake;
  $("#wake").setAttribute("aria-pressed", String(wake));
};
$("#cont").onclick = () => {
  continuous = !continuous; syncCont();
  if (continuous) listen(); else if (recActive) rec.stop();
};

$("#key").value = store.get("jarvis_or_key");
$("#model").value = store.get("jarvis_or_model");
$("#key").oninput = e => store.set("jarvis_or_key", e.target.value.trim());
$("#city").value = store.get("jarvis_city");
$("#city").oninput = e => store.set("jarvis_city", e.target.value.trim());
$("#nick").value = store.get("jarvis_nick");
$("#nick").oninput = e => store.set("jarvis_nick", e.target.value.trim());
$("#model").oninput = e => store.set("jarvis_or_model", e.target.value.trim());

speechSynthesis.getVoices();

/* Lignes de code décoratives sur les côtés */
function codeBlock() {
  const words = ["audio", "mic", "stream", "core", "voice", "net", "sync", "cache", "radar", "hud", "token", "model", "sensor", "power", "link"];
  const hex = n => Math.floor(Math.random() * 16 ** n).toString(16).padStart(n, "0");
  const pick = a => a[Math.floor(Math.random() * a.length)];
  const tpl = [
    () => "0x" + hex(4) + "  " + pick(["mov", "push", "call", "xor", "jmp"]) + " r" + Math.floor(Math.random() * 9),
    () => pick(words) + "." + pick(["init", "scan", "sync", "load", "check"]) + "()  // ok",
    () => "const " + pick(words) + "_" + hex(2) + " = 0x" + hex(3) + ";",
    () => "[" + hex(2).toUpperCase() + "] " + pick(words) + " ... " + pick(["OK", "ONLINE", "READY", "LOCKED"]),
    () => "if (" + pick(words) + " > " + Math.floor(Math.random() * 99) + ") {",
    () => "  return " + pick(words) + "(" + hex(2) + ");",
    () => "}",
    () => hex(8) + " " + hex(8)
  ];
  const b = Array.from({ length: 70 }, () => pick(tpl)()).join("\n");
  return b + "\n" + b + "\n";
}
$("#codeL").textContent = codeBlock();
$("#codeR").textContent = codeBlock();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});

setTheme(themeName());
$("#theme").onclick = () => setTheme(THEMES[(THEMES.indexOf(themeName()) + 1) % THEMES.length]);
renderMemo();

async function sysTick() {
  let t = navigator.onLine ? "en ligne" : "hors ligne";
  try { const b = await navigator.getBattery(); t += " · batterie " + Math.round(b.level * 100) + " %"; } catch {}
  $("#sys").textContent = t;
}
sysTick(); setInterval(sysTick, 15000);

(function boot() {
  const el = $("#boot"), out = $("#bootText");
  const lines = ["J.A.R.V.I.S. : initialisation", "Noyau vocal ........ OK", "Liaison réseau ..... " + (navigator.onLine ? "OK" : "HORS LIGNE"),
    "Mémoire ............ " + mem.get().length + " entrée(s)", "Interface .......... OK", ...(themeName() === "tac" ? ["Mode tactique ..... ACTIF"] : []), "Systèmes en ligne."];
  let i = 0, done = false;
  const end = () => { if (done) return; done = true; el.classList.add("off"); chime(880, 0.18); };
  el.onclick = end;
  const next = () => { if (done) return; if (i < lines.length) { out.textContent += lines[i++] + "\n"; setTimeout(next, 380); } else setTimeout(end, 500); };
  next();
})();

document.querySelectorAll(".chip").forEach(b => b.onclick = () => { if (!busy) handle(b.dataset.cmd); });

function tick() {
  const d = new Date();
  $("#clock").textContent = d.toLocaleDateString("fr-FR", { weekday: "short", day: "numeric", month: "short" }) + "  " + d.toLocaleTimeString("fr-FR");
}
tick(); setInterval(tick, 1000);
addMsg("bot", (new Date().getHours() < 18 ? "Bonjour" : "Bonsoir") + " " + nick() + ". Clique sur le cercle et parle. Essaie : « retiens que… », « note : … », « rappelle-moi dans 10 minutes de… », « appelle-moi chef », « diagnostic », « infos du matin » ou « thème rouge ».");
</script>
